name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: SkyScraper-linux-x86_64.AppImage
          - os: macos-latest
            artifact: SkyScraper-macos.zip
          - os: windows-latest
            artifact: SkyScraper-windows.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'
          cache: 'maven'

      - name: Determine app version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0"
          fi
          # macOS bundles require major >= 1; substitute for v0.x.y tags.
          if [[ "$RUNNER_OS" == "macOS" && "$VERSION" == 0.* ]]; then
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build jar + stage dependencies
        shell: bash
        run: |
          mvn -B -q clean package -DskipTests
          mvn -B -q dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/jpackage-input
          cp target/skyscraper-1.0.0-SNAPSHOT.jar target/jpackage-input/

      - name: jpackage app-image
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --name SkyScraper \
            --app-version ${{ steps.version.outputs.version }} \
            --dest target/dist \
            --input target/jpackage-input \
            --main-jar skyscraper-1.0.0-SNAPSHOT.jar \
            --main-class application.Main \
            --module-path target/jpackage-input \
            --add-modules javafx.controls,javafx.fxml,javafx.graphics \
            --java-options "--enable-native-access=javafx.graphics" \
            --java-options "--add-exports=javafx.base/com.sun.javafx.event=ALL-UNNAMED" \
            --java-options "--add-exports=javafx.base/com.sun.javafx.logging=ALL-UNNAMED" \
            --java-options "--add-exports=javafx.graphics/com.sun.javafx.sg.prism=ALL-UNNAMED" \
            --java-options "--add-exports=javafx.graphics/com.sun.javafx.scene=ALL-UNNAMED" \
            --java-options "--add-exports=javafx.graphics/com.sun.javafx.util=ALL-UNNAMED" \
            --java-options "--add-exports=javafx.graphics/com.sun.prism=ALL-UNNAMED" \
            --java-options "--add-exports=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED" \
            --java-options "--add-exports=javafx.graphics/com.sun.javafx.geom.transform=ALL-UNNAMED" \
            --java-options "--add-exports=javafx.graphics/com.sun.javafx.tk=ALL-UNNAMED"

      - name: Wrap as AppImage (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p target/SkyScraper.AppDir/usr
          cp -r target/dist/SkyScraper/. target/SkyScraper.AppDir/usr/
          cp src/main/resources/logo.png target/SkyScraper.AppDir/SkyScraper.png
          cat > target/SkyScraper.AppDir/SkyScraper.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SkyScraper
          Comment=Flight data visualizer
          Exec=SkyScraper
          Icon=SkyScraper
          Categories=Science;Education;
          EOF
          cat > target/SkyScraper.AppDir/AppRun <<'EOF'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/SkyScraper" "$@"
          EOF
          chmod +x target/SkyScraper.AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract >/dev/null
          ARCH=x86_64 ./squashfs-root/AppRun target/SkyScraper.AppDir target/SkyScraper-linux-x86_64.AppImage

      - name: Zip .app bundle (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd target/dist
          zip -ry ../SkyScraper-macos.zip SkyScraper.app

      - name: Zip folder (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/dist/SkyScraper -DestinationPath target/SkyScraper-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*/*
